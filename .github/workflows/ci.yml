name: fast-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[docs]'
          python -m pip install -e ".[test]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run fast tests
        run: python -m pytest -q

      - name: Check hand-written runtime coverage
        run: >-
          python -m pytest -q tests/unit
          --cov=starlink._environment
          --cov=starlink._runtime
          --cov=starlink._results
          --cov=starlink.wrapper
          --cov=starlink.utilities
          --cov=starlink.fluxes
          --cov-report=term-missing
          --cov-fail-under=85

      - name: Build documentation strictly
        run: python -m sphinx -W --keep-going -b html doc doc/_build/html

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Audit distribution payloads
        run: python scripts/audit_distribution.py dist

      - name: Test an isolated wheel installation
        run: |
          python -m venv /tmp/starlink-pywrapper-wheel
          /tmp/starlink-pywrapper-wheel/bin/python -m pip install dist/*.whl
          /tmp/starlink-pywrapper-wheel/bin/python -m pip check
          /tmp/starlink-pywrapper-wheel/bin/python -c "import starlink, starlink.kappa, starlink.wrapper"
