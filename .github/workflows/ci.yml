name: fast-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8" "build>=1.2"

      - name: Run fast tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build
